<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#1f4fd1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>来場カウンター</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#18202f; --sub:#5b6577; --line:#dfe4ee;
  --accent:#1f4fd1; --accent-ink:#fff; --soft:#e8eefc; --warn:#c2361f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10131a; --card:#1a1f2a; --ink:#eef1f7; --sub:#9aa4b6; --line:#2c3342;
    --accent:#5b8cff; --accent-ink:#0b1020; --soft:#232c40; --warn:#ff7a63; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:15px;color:var(--sub);font-weight:600;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:14px;color:var(--sub);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}
.stats .card{padding:10px}
.stat .lbl{font-size:13px;color:var(--sub);font-weight:600}
.stat .big{font-size:clamp(24px,8vw,40px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .big small{font-size:16px;font-weight:600;color:var(--sub);margin-left:2px}
.stat.today{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.today .lbl,.stat.today .big small{color:inherit;opacity:.85}
.note{font-size:12px;color:var(--sub);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:10px 16px;font-size:16px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num{border:none;background:var(--soft);color:var(--ink);border-radius:12px;padding:18px 0;
  font-size:26px;font-weight:800}
.num:active{transform:scale(.96)}
.num span{font-size:13px;font-weight:600;margin-left:1px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600}
.log li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.log{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.log .t{color:var(--sub);font-variant-numeric:tabular-nums;margin-right:8px}
.x{border:1px solid var(--line);background:transparent;color:var(--warn);border-radius:8px;padding:4px 10px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{width:100%;margin-top:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 0;font-size:17px;font-weight:700}
.back:disabled{opacity:.4}
.qrs{max-width:240px;margin:8px auto 0}
.qr{text-align:center;font-size:13px;color:var(--sub)}
.qr .img{background:#fff;border-radius:10px;padding:8px;display:inline-block;width:100%}
.qr .img img,.qr .img svg{width:100%;height:auto;display:block}
.qr b{display:block;color:var(--ink);font-size:14px;margin:6px 0 2px}
.qr a{color:var(--accent);word-break:break-all}
.more{margin-top:10px;border:1.5px solid var(--accent);border-radius:14px;padding:10px;background:var(--card)}
.moreHead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:8px}
.more .num{padding:14px 0;font-size:22px}
.num.open{background:var(--accent);color:var(--accent-ink)}
.sync{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--sub)}
.sync .btn{padding:8px 12px;font-size:13px}
.sync .ng{color:var(--warn);font-weight:700}
.hist li{gap:8px}
.hist .op{font-weight:700;margin-right:6px}
.hist .dev{font-size:12px;color:var(--sub);margin-left:6px}
.hist .x.ok{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  border-radius:12px;padding:12px 14px;font-size:15px;display:none;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);
  width:calc(100% - 32px);max-width:420px;justify-content:space-between}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
details summary{cursor:pointer;font-size:14px;color:var(--sub);font-weight:600;padding:6px 0}
.empty{color:var(--sub);font-size:14px;padding:6px 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<main>
  <h1><span id="title">来場カウンター</span><span id="clock"></span></h1>

  <div class="stats">
    <div class="card stat">
      <div class="lbl">1日目</div>
      <div class="big"><span id="dG">0</span><small>組</small></div>
      <div class="big"><span id="dP">0</span><small>人</small></div>
    </div>
    <div class="card stat today">
      <div class="lbl" id="todayLbl">2日目</div>
      <div class="big"><span id="tG">0</span><small>組</small></div>
      <div class="big"><span id="tP">0</span><small>人</small></div>
    </div>
    <div class="card stat">
      <div class="lbl">合計</div>
      <div class="big"><span id="cG">0</span><small>組</small></div>
      <div class="big"><span id="cP">0</span><small>人</small></div>
    </div>
  </div>
  <div class="note" id="baseNote"></div>
  <div class="sync"><span id="syncStat">共有: 確認中…</span><button class="btn" id="syncBtn">保存して最新を読み込む</button></div>

  <div id="placeSec">
    <h2>① 地点をえらぶ（任意）</h2>
    <div class="chips" id="places"></div>
  </div>

  <h2 id="numsHead">人数をタップで記録</h2>
  <div class="nums" id="nums"></div>
  <div class="more" id="more" hidden>
    <div class="moreHead"><span>8人以上</span><button class="x" id="moreClose" style="color:var(--sub)">閉じる</button></div>
    <div class="nums" id="moreNums"></div>
  </div>
  <button class="back" id="back">↶ 戻る（この端末の1つ前の記録を取り消す）</button>

  <div id="byPlaceSec">
    <h2>地点別（2日目）</h2>
    <div class="card"><table id="byPlace"></table></div>
  </div>

  <h2>時間帯別（2日目）</h2>
  <div class="card"><table id="byHour"></table></div>

  <h2>記録（新しい順）</h2>
  <div class="card"><ul class="log" id="log"></ul></div>

  <h2>変更履歴（新しい順）</h2>
  <div class="card"><ul class="log hist" id="hist"></ul></div>

  <h2>設定</h2>
  <div class="card">
    <details>
      <summary>1日目の数・地点の編集・保存</summary>
      <div class="grid2" style="margin-top:8px">
        <div><label>1日目の組数</label><input id="bG" type="number" inputmode="numeric" min="0"></div>
        <div><label>1日目の人数</label><input id="bP" type="number" inputmode="numeric" min="0"></div>
      </div>
      <div style="margin-top:10px"><label>今日の呼び名</label><input id="dayName"></div>
      <div style="margin-top:10px">
        <label>地点を追加（例: 正面入口、駐車場、〇〇市内）</label>
        <div class="row"><input id="newPlace" style="flex:1"><button class="btn" id="addPlace">追加</button></div>
        <div class="chips" id="placeEdit" style="margin-top:8px"></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="csv">CSV を保存</button>
        <button class="btn" id="reset" style="color:var(--warn)">今日の記録を全部消す</button>
      </div>
      <div class="note">記録はサーバーに保存され、このページを開いている端末どうしで共有されます（10 秒おきに自動で合わせます）。通信できないあいだはこの端末に保存し、つながったら自動で送ります。念のため、終わったら CSV を保存してください。</div>
    </details>
    <details id="qrBox">
      <summary>ページの QR コード</summary>
      <div class="qrs" id="qrs"></div>
    </details>
  </div>
</main>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">取り消し</button></div>

<script>
const BUILD = '20261122103443'; // commit のたびに自動で書き換わる（.git/hooks/pre-commit）
// 新しい版が出ていたら読み込み直す（キャッシュを避けるため毎回 URL を変えて確認）
async function checkUpdate() {
  try {
    const r = await fetch(location.pathname + '?cb=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD && BUILD !== 'dev') location.replace(location.pathname + '?v=' + m[1]);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
setInterval(checkUpdate, 120000);
setTimeout(checkUpdate, 3000);
const KEY = 'event-counter-v1';
// QR で出すページ
const COMPANY_URL = 'https://chiba-prh.github.io/event-counter/';
const DEF = { baseG: 38, baseP: 87, dayName: '2日目', places: [], items: [], log: [], metaAt: 0, mine: [], dev: '' };
// 端末間の共有（パールラボのサーバー）
const SYNC_URL = 'https://gyosei-lab.jp/api/count.php?room=ev-2026-11';
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = Object.assign({}, DEF); }
// 以前の仮の地点（市内・市外・県外）は外す
if (S.places.join() === '市内,市外,県外') { S.places = []; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// items: 1 組 = 1 件 {id,t,n,place,del,v}。消しても del=true で残すので元に戻せる。v は最後に変えた時刻（端末間で新しい方を使う）
function mergeItems(a, b) {
  const m = new Map();
  [...a, ...b].forEach(x => {
    const it = Object.assign({}, x, { id: String(x.id), v: x.v || 0, del: !!x.del, n: x.n || 0, t: x.t || 0, place: x.place || '' });
    const c = m.get(it.id);
    if (!c) { m.set(it.id, it); return; }
    if (it.v > c.v || (it.v === c.v && it.del && !c.del)) {
      if (!it.n && c.n) Object.assign(it, { n: c.n, t: c.t, place: c.place });
      m.set(it.id, it);
    } else if (!c.n && it.n) Object.assign(c, { n: it.n, t: it.t, place: it.place });
  });
  return [...m.values()].sort((x, y) => x.t - y.t);
}
function mergeLog(a, b) {
  const m = new Map(); [...a, ...b].forEach(l => { if (l && l.id && !m.has(l.id)) m.set(l.id, l); });
  return [...m.values()].sort((x, y) => x.at - y.at).slice(-3000);
}
// 前の版の保存形式（entries + deleted）から移す
if (Array.isArray(S.entries) || Array.isArray(S.deleted)) {
  S.items = mergeItems(S.items || [], [
    ...(S.entries || []).map(e => ({ id: e.id, t: e.t, n: e.n, place: e.place, del: false, v: 0 })),
    ...(S.deleted || []).map(id => ({ id, del: true, v: 1 }))]);
  delete S.entries; delete S.deleted;
}
if (!S.dev) S.dev = uid();
const act = () => S.items.filter(e => !e.del && e.n > 0);
// 履歴の機能より前に付けた記録・消した記録にも履歴を 1 行ずつ作る（id を記録から決めるので、どの端末で作っても同じ行になる）
function backfill() {
  const hasAdd = new Set(), hasAny = new Set();
  S.log.forEach(l => (l.eids || []).forEach(id => { hasAny.add(id); if (l.op === 'add') hasAdd.add(id); }));
  let added = false;
  S.items.forEach(it => {
    if (!it.n) return;
    if (!hasAdd.has(it.id)) { S.log.push({ id: 'pre-' + it.id, at: it.t, op: 'add', dev: '', text: `${it.n}人を記録`, eids: [it.id] }); added = true; }
    if (it.del && !hasAny.has(it.id)) { S.log.push({ id: 'pred-' + it.id, at: it.v > 1 ? it.v : it.t + 1, op: 'delete', dev: '', text: `${hhmm(it.t)} の ${it.n}人`, eids: [it.id] }); added = true; }
  });
  if (added) S.log = mergeLog([], S.log);
  return added;
}
let sel = null, lastId = null, toastTimer = null;
const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function logIt(op, text, eids) { S.log.push({ id: uid(), at: Date.now(), op, dev: S.dev, text, eids: eids || [] }); }
function add(n) {
  const now = Date.now();
  const e = { id: uid(), t: now, n, place: sel || '', del: false, v: now };
  S.items.push(e); S.mine.push(e.id); lastId = e.id;
  logIt('add', `${n}人を記録`, [e.id]);
  save(); render(); syncSoon();
  showToast(`${e.place ? e.place + '・' : ''}${n}人 を記録（${act().length}組目）`);
  sel = null; renderPlaces();
}
const OPS = { add: '＋ 記録', delete: '✕ 消す', back: '↶ 戻る', undo: '↶ 取り消し', restore: '↺ 元に戻す', reset: '✕ 全部消す', meta: '⚙ 設定' };
// ids の記録を消す（del=true）か元に戻す（del=false）。履歴に 1 行残す
function setDel(ids, del, op, text) {
  const now = Date.now(), done = [];
  ids.forEach(id => {
    const it = S.items.find(x => x.id === String(id));
    if (!it || it.del === del) return;
    it.del = del; it.v = Math.max(now, it.v + 1); done.push(it);
  });
  if (!done.length) return null;
  logIt(op, text || (done.length === 1 ? `${hhmm(done[0].t)} の ${done[0].n}人` : `${done.length}組`), done.map(x => x.id));
  save(); render(); syncSoon();
  return done;
}
const del = (id, op = 'delete') => setDel([id], true, op);
function setMeta(f, text) { f(); S.metaAt = Date.now(); if (text) logIt('meta', text); save(); render(); syncSoon(); }

let syncing = false, again = false, syncTimer = null, lastOk = 0;
function syncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 300); }
async function sync() {
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    const body = JSON.stringify({ items: S.items, log: S.log,
      meta: { at: S.metaAt || 0, baseG: S.baseG, baseP: S.baseP, dayName: S.dayName } });
    const r = await fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    // 送っているあいだに変えた分も残す（v の新しい方）
    S.items = mergeItems(d.items || [], S.items);
    S.log = mergeLog(d.log || [], S.log);
    if (backfill()) again = true;
    if (d.meta && d.meta.at > (S.metaAt || 0)) { S.metaAt = d.meta.at; S.baseG = d.meta.baseG; S.baseP = d.meta.baseP; S.dayName = d.meta.dayName || S.dayName; }
    save(); lastOk = Date.now();
    if (document.activeElement && document.activeElement.tagName === 'INPUT') renderStat(); else render();
  } catch (e) {
    renderStat(true);
  } finally {
    syncing = false;
    if (again) { again = false; syncSoon(); }
  }
}
function renderHist() {
  const byId = new Map(S.items.map(x => [x.id, x]));
  const latest = new Map(); S.log.forEach(l => (l.eids || []).forEach(id => latest.set(id, l.id)));
  const rows = S.log.slice().reverse().slice(0, 300);
  $('hist').innerHTML = rows.length ? rows.map(l => {
    const ids = (l.eids || []).filter(id => latest.get(id) === l.id && byId.has(id));
    let btn = '';
    if (ids.length && ['add', 'restore'].includes(l.op) && ids.some(id => !byId.get(id).del)) btn = `<button class="x" data-do="del" data-l="${l.id}">取り消す</button>`;
    if (ids.length && ['delete', 'back', 'undo', 'reset'].includes(l.op) && ids.some(id => byId.get(id).del)) btn = `<button class="x ok" data-do="restore" data-l="${l.id}">${l.op === 'reset' ? '全部元に戻す' : '元に戻す'}</button>`;
    return `<li><span><span class="t">${hhmm(l.at)}</span><span class="op">${OPS[l.op] || esc(l.op)}</span>${esc(l.text || '')}<span class="dev">${l.dev === S.dev ? 'この端末' : l.dev ? '他の端末' : '履歴の機能より前'}</span></span>${btn}</li>`;
  }).join('') : '<li class="empty">まだ変更はありません</li>';
  $('hist').querySelectorAll('.x').forEach(b => b.onclick = () => {
    const l = S.log.find(x => x.id === b.dataset.l); if (!l) return;
    const ids = (l.eids || []).filter(id => latest.get(id) === l.id);
    if (b.dataset.do === 'restore') { const d = setDel(ids, false, 'restore'); if (d) showToast(`元に戻しました（${d.length}組）`, false); }
    else if (confirm('この記録を取り消しますか？')) setDel(ids, true, 'delete');
  });
}
function renderStat(ng) {
  $('syncStat').innerHTML = ng
    ? '<span class="ng">共有: 通信できません</span>（この端末に保存中・つながったら自動で送ります）'
    : '共有: ' + (lastOk ? hhmm(lastOk) + ' に同期済み' : '確認中…');
}
$('syncBtn').onclick = () => { $('syncStat').textContent = '共有: 同期中…'; sync(); };
setInterval(() => { if (!document.hidden) sync(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', sync);
function showToast(msg, undo = true) {
  $('undo').style.display = undo ? '' : 'none';
  $('toastMsg').textContent = msg; $('toast').style.display = 'flex';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').style.display = 'none', 5000);
}
$('undo').onclick = () => { if (lastId != null) del(lastId, 'undo'); lastId = null; $('toast').style.display = 'none'; };

$('back').onclick = () => {
  // この端末で付けた記録のうち最後のもの（他の端末の記録は戻さない）
  const e = act().reverse().find(x => S.mine.includes(x.id)); if (!e) { showToast('この端末で付けた記録がありません', false); return; }
  del(e.id, 'back'); lastId = null; showToast(`戻しました（${hhmm(e.t)} の ${e.n}人 を取り消し）`, false);
};
function renderPlaces() {
  const has = S.places.length > 0;
  $('placeSec').style.display = has ? '' : 'none';
  $('numsHead').textContent = has ? '② 人数をタップで記録' : '人数をタップで記録';
  $('places').innerHTML = S.places.map(p => `<button class="chip ${sel===p?'on':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')
    || '<div class="empty">設定から地点を追加できます</div>';
  $('places').querySelectorAll('.chip').forEach(b => b.onclick = () => { sel = sel === b.dataset.p ? null : b.dataset.p; renderPlaces(); });
  $('placeEdit').innerHTML = S.places.map((p,i) => `<button class="chip" data-i="${i}">${esc(p)} ✕</button>`).join('');
  $('placeEdit').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    if (confirm(`地点「${S.places[b.dataset.i]}」を一覧から外しますか？（記録は残ります）`)) { S.places.splice(b.dataset.i,1); save(); render(); }
  });
}

function render() {
  const E = act(), g = E.length, p = E.reduce((a,e)=>a+e.n,0);
  $('tG').textContent = g; $('tP').textContent = p;
  $('dG').textContent = S.baseG; $('dP').textContent = S.baseP;
  $('cG').textContent = S.baseG + g; $('cP').textContent = S.baseP + p;
  $('todayLbl').textContent = S.dayName; $('title').textContent = '来場カウンター（' + S.dayName + '）';
  $('baseNote').textContent = g ? `${S.dayName}の平均 ${(p/g).toFixed(1)}人/組` : '';
  $('bG').value = S.baseG; $('bP').value = S.baseP; $('dayName').value = S.dayName;

  $('back').disabled = !E.some(e => S.mine.includes(e.id));
  $('byPlaceSec').style.display = (S.places.length || E.some(e => e.place)) ? '' : 'none';
  // by place
  const m = new Map(); S.places.forEach(x => m.set(x, {g:0,p:0}));
  E.forEach(e => { const k = e.place || '未選択'; if (!m.has(k)) m.set(k,{g:0,p:0}); m.get(k).g++; m.get(k).p += e.n; });
  const rows = [...m].filter(([k,v]) => v.g || S.places.includes(k));
  $('byPlace').innerHTML = '<tr><th>地点</th><th>組</th><th>人</th><th>人の割合</th></tr>' +
    rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v.g}</td><td>${v.p}</td><td>${p? Math.round(v.p/p*100):0}%</td></tr>`).join('') +
    `<tr><td><b>合計</b></td><td><b>${g}</b></td><td><b>${p}</b></td><td></td></tr>`;

  // by hour
  const h = new Map(); E.forEach(e => { const k = new Date(e.t).getHours(); if(!h.has(k)) h.set(k,{g:0,p:0}); h.get(k).g++; h.get(k).p+=e.n; });
  $('byHour').innerHTML = h.size ? '<tr><th>時間</th><th>組</th><th>人</th></tr>' +
    [...h].sort((a,b)=>a[0]-b[0]).map(([k,v]) => `<tr><td>${k}時台</td><td>${v.g}</td><td>${v.p}</td></tr>`).join('')
    : '<tr><td class="empty">まだ記録がありません</td></tr>';

  // log
  $('log').innerHTML = E.length ? E.slice().reverse().map((e,i) =>
    `<li><span><span class="t">${hhmm(e.t)}</span>${E.length-i}組目　${e.n}人${e.place?'　'+esc(e.place):''}</span><button class="x" data-id="${e.id}">消す</button></li>`).join('')
    : '<li class="empty">まだ記録がありません</li>';
  $('log').querySelectorAll('.x').forEach(b => b.onclick = () => { if (confirm('この記録を消しますか？')) del(b.dataset.id, 'delete'); });
  renderHist();
  renderPlaces();
  renderStat();
}

// number buttons
$('nums').innerHTML = [1,2,3,4,5,6,7].map(n => `<button class="num" data-n="${n}">${n}<span>人</span></button>`).join('') +
  '<button class="num" data-n="x" style="font-size:18px">8人〜</button>';
$('nums').querySelectorAll('.num').forEach(b => b.onclick = () => {
  if (b.dataset.n === 'x') { toggleMore(); }
  else add(Number(b.dataset.n));
});

function toggleMore(open) {
  const m = $('more'); const show = open ?? m.hidden; m.hidden = !show;
  document.querySelector('.num[data-n="x"]').classList.toggle('open', show);
}
$('moreNums').innerHTML = Array.from({length: 13}, (_, i) => i + 8).map(n => `<button class="num" data-n="${n}">${n}<span>人</span></button>`).join('') +
  '<button class="num" data-n="other" style="font-size:16px">21人〜</button>';
$('moreNums').querySelectorAll('.num').forEach(b => b.onclick = () => {
  if (b.dataset.n === 'other') { const v = parseInt(prompt('人数を入力してください', '21'), 10); if (v > 0) add(v); }
  else add(Number(b.dataset.n));
  toggleMore(false);
});
$('moreClose').onclick = () => toggleMore(false);
$('bG').onchange = () => { const o = S.baseG, v = Math.max(0, parseInt($('bG').value,10) || 0); setMeta(() => S.baseG = v, `1日目の組数 ${o} → ${v}`); };
$('bP').onchange = () => { const o = S.baseP, v = Math.max(0, parseInt($('bP').value,10) || 0); setMeta(() => S.baseP = v, `1日目の人数 ${o} → ${v}`); };
$('dayName').onchange = () => { const o = S.dayName, v = $('dayName').value.trim() || '2日目'; setMeta(() => S.dayName = v, `呼び名 ${o} → ${v}`); };
$('addPlace').onclick = () => { const v = $('newPlace').value.trim(); if (v && !S.places.includes(v)) { S.places.push(v); save(); } $('newPlace').value=''; render(); };
$('reset').onclick = () => { if (confirm('今日の記録をすべて消します。よろしいですか？') && confirm('本当に消しますか？（変更履歴から元に戻せます）')) { const ids = act().map(e => e.id); setDel(ids, true, 'reset', `${ids.length}組を全部消す`); } };
$('csv').onclick = () => {
  const lines = ['時刻,人数,地点', ...act().map(e => `${new Date(e.t).toLocaleString('ja-JP')},${e.n},"${(e.place||'').replace(/"/g,'""')}"`)];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv'}));
  a.download = `来場記録_${S.dayName}.csv`; a.click();
};
function renderQR() {
  const url = COMPANY_URL;
  let img = '<div class="empty" style="padding:30px 0">QR を読み込めません（通信を確認）</div>';
  if (window.qrcode) { const q = qrcode(0, 'M'); q.addData(url); q.make(); img = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  $('qrs').innerHTML = `<div class="qr"><div class="img">${img}</div><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>`;
}
$('qrBox').addEventListener('toggle', renderQR);
const tick = () => $('clock').textContent = hhmm(Date.now()); tick(); setInterval(tick, 10000);
render();
sync();
</script>
</body>
</html>
